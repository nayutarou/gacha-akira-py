version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.12.3
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-cache-{{ checksum "requirements.txt" }}
            - v1-pip-cache-
      - run:
          name: Install Dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install pip-tools
      - save_cache:
          key: v1-pip-cache-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Check and update requirements.txt
          command: |
            . venv/bin/activate
            # Overwrite requirements.txt with the latest dependencies
            pip-compile --no-header --strip-extras --upgrade --output-file=requirements.txt requirements.in

            # Check for changes and commit them if any exist
            if ! git diff --quiet requirements.txt; then
              git config user.email "ci-bot@circleci"
              git config user.name "CircleCI Bot"
              git add requirements.txt
              git commit -m "ci: Update requirements.txt"
              git push
              echo "requirements.txt was updated and pushed to the repository."
            else
              echo "requirements.txt is already up to date."
            fi

  test:
    docker:
      - image: cimg/python:3.12.3
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-cache-{{ checksum "requirements.txt" }}
            - v1-pip-cache-
      - run:
          name: Install Dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run Tests
          command: |
            . venv/bin/activate
            pytest -s tests

  lint:
    docker:
      - image: cimg/python:3.12.3
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pip-cache-{{ checksum "requirements.txt" }}
            - v1-pip-cache-
      - run:
          name: Install Dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Check Code Format with Black
          command: |
            . venv/bin/activate
            black --check .

workflows:
  version: 2
  build-test-and-lint:
    jobs:
      - build
      - test:
          requires:
            - build
      - lint:
          requires:
            - build
